name: Full live page and button audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-production-exhaustive.mjs'
      - 'scripts/audit-cookie-controls.mjs'
      - '.github/workflows/full-site-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Audit every live page, link, button, form and loaded resource
        id: audit
        continue-on-error: true
        run: node scripts/audit-production-exhaustive.mjs https://cleansceneinvestigators.com

      - name: Click cookie accept and decline on every live page
        id: cookies
        continue-on-error: true
        run: node scripts/audit-cookie-controls.mjs https://cleansceneinvestigators.com

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csi-production-exhaustive-audit
          path: production-exhaustive-audit.json
          if-no-files-found: error

      - name: Fail on critical/high or interaction failures
        if: steps.audit.outcome == 'failure' || steps.cookies.outcome == 'failure'
        run: exit 1
