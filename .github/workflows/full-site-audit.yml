name: Full live page and button audit

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply precision SEO metadata and schema updates
        run: python scripts/apply_precision_seo.py

      - name: Commit precision SEO updates when needed
        run: |
          if git diff --quiet; then
            echo "Precision SEO already applied; no source changes needed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dallas-tx-response/index.html fort-worth-tx-response/index.html service-areas-in-texas/index.html sitemap.website.xml
            git commit -m "Apply precision Dallas Fort Worth SEO updates"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Audit every live page, link, button, form and loaded resource
        id: audit
        continue-on-error: true
        run: node scripts/audit-production-exhaustive.mjs https://cleansceneinvestigators.com

      - name: Click cookie accept and decline on every live page
        id: cookies
        continue-on-error: true
        run: node scripts/audit-cookie-controls.mjs https://cleansceneinvestigators.com

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csi-production-exhaustive-audit
          path: production-exhaustive-audit.json
          if-no-files-found: error

      - name: Fail on critical/high or interaction failures
        if: steps.audit.outcome == 'failure' || steps.cookies.outcome == 'failure'
        run: exit 1
